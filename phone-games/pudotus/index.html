<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Drop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
      <div class="stat"><span class="label">Moves</span><span id="moves" class="value">0</span></div>
      <div class="stat" id="rowStat"><span class="label">New row in</span><span class="value"><span id="rowIn">8</span> <small>moves</small></span></div>
    </header>

    <section id="queue">
      <div class="q-slot"><span class="label">Drop</span><div id="qCurrent" class="q-cube"></div></div>
      <div class="q-slot" id="qNextSlot"><span class="label">Next</span><div id="qNext" class="q-cube small"></div></div>
    </section>

    <main id="boardWrap">
      <div id="board">
        <div id="columns"></div>
        <div id="cubes"></div>
        <div id="fx"></div>
      </div>
    </main>
  </div>

  <div id="startScreen" class="overlay">
    <div class="card">
      <div class="logo" id="logo"></div>
      <h1>Drop</h1>
      <p class="rules">Tap a column to drop a cube. Three of the same color in a row are cleared. Every now and then a new row rises from the bottom – don't let the stack grow over the top.</p>
      <p class="best">Best score: <b id="startBest">0</b></p>
      <button class="btn" id="playBtn">Play</button>
    </div>
  </div>

  <div id="endScreen" class="overlay hidden">
    <div class="card">
      <h1>Game over</h1>
      <p class="newbest hidden" id="newBest">New record!</p>
      <div class="results">
        <div><span class="label">Score</span><b id="endScore">0</b></div>
        <div><span class="label">Moves</span><b id="endMoves">0</b></div>
        <div><span class="label">Best</span><b id="endBest">0</b></div>
      </div>
      <button class="btn" id="againBtn">Play again</button>
    </div>
  </div>

  <div id="debug" class="hidden"></div>

  <script src="game.js"></script>
</body>
</html>
